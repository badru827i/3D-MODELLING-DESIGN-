name: PRISMA Native Builds
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"
  workflow_dispatch:

jobs:
  android-arm64:
    name: Native Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          target: android
          arch: android_arm64_v8a
          modules: qtquick3d, qtshadertools
          cache: true

      - name: Configure native Android app
        run: |
          echo "Qt root: $QT_ROOT_DIR"
          test -x "$QT_ROOT_DIR/bin/qt-cmake"
          "$QT_ROOT_DIR/bin/qt-cmake" -S native -B build-android -GNinja \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            -DANDROID_PLATFORM=android-26

      - name: Build APK
        run: cmake --build build-android --target apk --parallel 2

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: prisma-3d-engineer-native-android-arm64
          path: build-android/android-build/*.apk
          if-no-files-found: error
          retention-days: 30

  windows-desktop:
    name: Native Windows x64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtquick3d, qtshadertools
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-3d-engineer-native-windows-x64
          path: build/
          if-no-files-found: error
          retention-days: 30
